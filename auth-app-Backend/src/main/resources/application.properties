spring.application.name=auth-app

spring.datasource.url=jdbc:mysql://localhost:3306/auth_app
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
security.jwt.secret=MySuperSecureJwtSecretKeyForSpringBootAuthenticationApplication2026HS512SecurityTokenKey1234567890
security.jwt.issuer=auth-app
security.jwt.access-ttl-seconds=3600
security.jwt.refresh-ttl-seconds=604800

security.jwt.refresh-token-cookie-name=refreshToken
security.jwt.cookie-secure=true
security.jwt.cookie-http-only=true
security.jwt.cookie-same-site=lax
security.jwt.cookie.domain=localhost


# Google OAuth2

spring.security.oauth2.client.registration.google.client-id= ${GOOGLE CLIENT ID: test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE CLIENT SECRET: test-client-secret}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub OAuth2

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:test-client-secret}

spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.frontend.url=http://localhost:5173